
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Directory | Unique Elite Club</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f2;
      color: #24352b;
    }
    header {
      background: #174b35;
      color: white;
      text-align: center;
      padding: 28px 16px;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; color: #e7d49a; }
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .panel {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0000000d;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5ce; }
    button {
      border: 0;
      background: #176344;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .secondary { background: #7b6323; }
    .member {
      border: 1px solid #e0e7df;
      padding: 15px;
      border-radius: 9px;
      margin-top: 12px;
    }
    .member h3 { margin: 0 0 8px; }
    .hidden { display: none; }
    #message { overflow-wrap: anywhere; }
    a { color: #176344; }
  </style>
</head>
<body>
  <header>
    <h1>Unique Elite Club</h1>
    <p>Unique! Togetherness We Rise!</p>
    <p>Approved Members Directory</p>
  </header>

  <main>
    <section id="loginPanel" class="panel">
      <h2>Member Login</h2>
      <p>Sign in with your registered member account to view the directory.</p>
      <form id="loginForm">
        <input id="email" type="email" placeholder="Email address" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
      </form>
      <p id="message" role="status"></p>
      <p><a href="member-login.html">Create a member account</a></p>
    </section>

    <section id="directoryPanel" class="panel hidden">
      <h2>Approved Members</h2>
      <p id="directoryMessage">Loading directory...</p>
      <div id="memberList"></div>
      <button id="refreshButton" type="button">Refresh Directory</button>
      <button id="logoutButton" class="secondary" type="button">Sign Out</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginPanel = document.getElementById("loginPanel");
    const directoryPanel = document.getElementById("directoryPanel");
    const message = document.getElementById("message");
    const directoryMessage = document.getElementById("directoryMessage");
    const memberList = document.getElementById("memberList");

    async function showDirectory() {
      loginPanel.classList.add("hidden");
      directoryPanel.classList.remove("hidden");
      await loadMembers();
    }

    async function loadMembers() {
      memberList.replaceChildren();
      directoryMessage.textContent = "Loading approved members...";

      const { data, error } = await client.rpc("get_approved_members");

      if (error) {
        directoryMessage.textContent =
          "Could not load directory: " + error.message;
        return;
      }

      if (!Array.isArray(data) || data.length === 0) {
        directoryMessage.textContent =
          "No approved members found, or the directory returned no records.";
        return;
      }

      directoryMessage.textContent = data.length + " approved member(s).";

      data.forEach(function(member) {
        const card = document.createElement("article");
        card.className = "member";

        const name = document.createElement("h3");
        name.textContent = member.full_name || "Club Member";
        card.appendChild(name);

        const number = document.createElement("p");
        number.textContent = "Membership number: " +
          (member.membership_number || member["Membership Number"] ||
           "Not assigned");
        card.appendChild(number);

        memberList.appendChild(card);
      });
    }

    document.getElementById("loginForm").addEventListener(
      "submit", async function(event) {
        event.preventDefault();
        message.textContent = "Signing in...";

        const { error } = await client.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) {
          message.textContent = "Login failed: " + error.message;
          return;
        }

        message.textContent = "";
        await showDirectory();
      }
    );

    document.getElementById("refreshButton").addEventListener(
      "click", loadMembers
    );

    document.getElementById("logoutButton").addEventListener(
      "click", async function() {
        await client.auth.signOut();
        directoryPanel.classList.add("hidden");
        loginPanel.classList.remove("hidden");
        message.textContent = "You have signed out.";
      }
    );

    async function start() {
      const { data, error } = await client.auth.getSession();

      if (error) {
        message.textContent = error.message;
        return;
      }

      if (data.session) {
        await showDirectory();
      }
    }

    start();
  </script>
</body>
</html>
